; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
; freertos-teensy requires a patched Teensy core (SysTick/PendSV are used by
; the RTOS), which is provided by this custom platform package.
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy40
framework = arduino
lib_deps =
    https://github.com/tsandmann/freertos-teensy.git
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bolderflight/Bolder Flight Systems Eigen @ ^3.0.0
    Wire
    etlcpp/Embedded Template Library @ ^20.38.2
    paulstoffregen/Encoder
    cesarvandevelde/HerkulexServo @ ^0.1.0
    sparkfun/SX1509 IO Expander @ ^3.0.2
    olikraus/U8g2 @ ^2.36.5

build_unflags = -std=gnu++17 -s
; -Iinclude makes freertos_config_override.h visible to the FreeRTOS library build
; USE_ARDUINO_DEFINES keeps Arduino macros (HIGH, INPUT, CHANGE, ...) which
; arduino_freertos.h would otherwise undefine, breaking Arduino libraries
build_flags = -g -w -std=gnu++20 -Iinclude -DUSE_ARDUINO_DEFINES -DUSB_SERIAL -DTEENSY_OPT_FASTER_LTO
; upload_flags = -v
upload_protocol = teensy-cli
; build_type = debug
